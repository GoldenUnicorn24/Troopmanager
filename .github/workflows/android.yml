name: Android APK

on:
  push:
    branches: [ "main", "claude/**", "codex/v0.61", "codex/v0.62", "codex/v0.63-frontier", "codex/v0.65", "codex/v0.66", "codex/v0.81", "codex/v0.82-overhaul", "codex/v0.83-fun-overhaul", "codex/v0.84-ui-overhaul", "codex/v0.85-modern-ui", "codex/v0.90-war-experience-overhaul", "codex/v0.95-living-realm-overhaul", "codex/v0.96-visual-world-overhaul", "codex/v0.97-battle-tactics-ui-overhaul", "codex/v1.0-realm-war-overhaul", "codex/v0.6-aaa-overhaul", "codex/v0.45-city-ui-overhaul", "codex/v0.4.0-core-overhaul" ]
  pull_request:
    branches: [ "main", "codex/v0.61", "codex/v0.62", "codex/v0.63-frontier", "codex/v0.65", "codex/v0.66", "codex/v0.81", "codex/v0.82-overhaul", "codex/v0.83-fun-overhaul", "codex/v0.84-ui-overhaul", "codex/v0.85-modern-ui", "codex/v0.90-war-experience-overhaul", "codex/v0.95-living-realm-overhaul", "codex/v0.96-visual-world-overhaul", "codex/v0.97-battle-tactics-ui-overhaul", "codex/v1.0-realm-war-overhaul", "codex/v0.45-city-ui-overhaul", "codex/v0.6-aaa-overhaul", "codex/v0.4.0-core-overhaul" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Stable test-build signature so new test APKs install as updates.
      # A repository secret DEV_KEYSTORE_BASE64 (debug-style keystore) wins; otherwise the
      # runner-generated debug key is kept in the Actions cache between builds.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: troopmanager-debug-keystore-v1

      - name: Use repository signing key if configured
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          mkdir -p build
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee build/apk-badging.txt
          python3 - <<'PYAPK'
          from pathlib import Path
          badging = Path("build/apk-badging.txt").read_text()
          assert "name='com.goldenunicorn.troopmanager'" in badging
          assert "versionCode='48'" in badging and "versionName='1.2.0'" in badging
          PYAPK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realm-of-the-Last-Wall-v1.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish download without login
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          cp app/build/outputs/apk/debug/app-debug.apk build/Realm-of-the-Last-Wall.apk
          gh release delete dev-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create dev-latest build/Realm-of-the-Last-Wall.apk -R "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Neueste Testversion ($GITHUB_REF_NAME)" \
            --notes "Automatisch gebaut aus $GITHUB_SHA auf $GITHUB_REF_NAME. Auf dem Handy herunterladen und öffnen."

      - name: Package APK signing helper
        run: |
          mkdir -p build/apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" build/apksigner-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/apksigner-tool/lib/
          chmod +x build/apksigner-tool/apksigner

      - name: Upload APK signing helper
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-linux-buildtools-35
          path: build/apksigner-tool
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realm-of-the-Last-Wall-v1.2.0-verification
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
            build/apk-badging.txt
          if-no-files-found: warn
          retention-days: 30

  battle-ui:
    name: Battle UI on Android 35
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify small screens, landscape and large fonts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            mkdir -p build/ui-screenshots
            adb pull /sdcard/Download/troopmanager-battle build/ui-screenshots
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realm-of-the-Last-Wall-v1.2.0-battle-ui
          path: |
            build/ui-screenshots
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 30
