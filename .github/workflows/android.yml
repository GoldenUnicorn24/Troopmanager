name: Android APK

on:
  push:
    branches: [ "main", "codex/v0.61", "codex/v0.6-aaa-overhaul", "codex/v0.45-city-ui-overhaul", "codex/v0.4.0-core-overhaul" ]
  pull_request:
    branches: [ "main", "codex/v0.61", "codex/v0.45-city-ui-overhaul", "codex/v0.6-aaa-overhaul", "codex/v0.4.0-core-overhaul" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realm-of-the-Last-Wall-v0.61.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package APK signing helper
        run: |
          mkdir -p build/apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" build/apksigner-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/apksigner-tool/lib/
          chmod +x build/apksigner-tool/apksigner

      - name: Upload APK signing helper
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-linux-buildtools-35
          path: build/apksigner-tool
          if-no-files-found: error
          retention-days: 30
